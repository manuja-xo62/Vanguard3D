name: VanguardNode Security Scan

on:
    pull_request:
        branches: ["main", "master"]

jobs:
    security-scan:
        runs-on: ubuntu-latest

        steps:
        -   name: Checkout Repository
            uses: actions/checkout@v4

        -   name: Set up Python
            uses: actions/setup-python@v5
            with:
                python-version: '3.11'
            
        -   name: Install Dependencies
            run:    |
                python -m pip install --upgrade pip
                pip install checkhov pyyaml
        
        -   name: Run Vanguard Scan
            run:    |
                python 2_CLI_Action/vanguard_cli.py scan . --json > results.json
            
        -   name: Post PR Comment
            if: always()
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run:    |
                python 2_CLI_Action/vanguard_cli.py comment-pr --results results.json
        

        
            